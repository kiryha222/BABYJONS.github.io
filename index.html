<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BABYJONS | Collective</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Unbounded:wght@400;900&family=Inter:wght@300;700&display=swap');

        :root {
            --red: #5f1c74;
            --dark: #0a0a0a;
            --gray: #1a1a1a;
        }

        body {
            margin: 0;
            background-color: var(--dark);
            color: #fff;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Hero Section */
        header {
            height: 90vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            border-bottom: 1px solid var(--gray);
        }

        .hero-title {
            font-family: 'Unbounded', sans-serif;
            font-size: clamp(60px, 15vw, 180px);
            font-weight: 900;
            line-height: 0.8;
            margin: 0;
            text-transform: uppercase;
            z-index: 2;
            mix-blend-mode: difference;
            animation: slideIn 1s ease-out;
        }

        @keyframes slideIn {
            from { transform: translateX(-30px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .header-logo {
            position: absolute;
            right: 0;
            width: 40%;
            max-width: 500px;
            height: 60vh;
            object-fit: cover;
            filter: brightness(0.8); 
            z-index: 1;
            transition: 0.8s ease;
        }

        header:hover .header-logo {
            filter: brightness(1);
            transform: scale(1.02);
        }

        .subtitle {
            font-size: 18px;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: var(--red);
            margin-top: 20px;
            font-weight: 700;
        }

        /* Roster Grid */
        section { padding: 100px 0; }

        h2 {
            font-family: 'Unbounded', sans-serif;
            font-size: 40px;
            margin-bottom: 60px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        h2::before {
            content: "";
            width: 50px;
            height: 4px;
            background: var(--red);
        }

        .roster {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 40px;
        }

        .player {
            position: relative;
            background: var(--gray);
            padding: 10px;
            transition: 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .player:hover {
            transform: translateY(-10px);
            background: #222;
        }

        .photo {
            width: 100%;
            aspect-ratio: 1/1;
            object-fit: cover;
            transition: 0.4s;
        }

        .pos-tag {
            position: absolute;
            top: -10px;
            left: -10px;
            background: var(--red);
            color: white;
            padding: 6px 14px;
            font-family: 'Unbounded', sans-serif;
            font-size: 12px;
            transform: rotate(-5deg);
            z-index: 10;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.5);
        }

        .name {
            font-size: 20px;
            font-weight: 700;
            margin: 15px 0 5px;
            text-transform: uppercase;
        }

        /* Achievements Section */
        .achievements-grid {
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 60px;
            background: var(--red);
            padding: 60px;
            color: white;
        }

        .achievements-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .achievements-list li {
            font-family: 'Unbounded', sans-serif;
            font-size: 24px;
            border-bottom: 2px solid rgba(255,255,255,0.3);
            padding: 20px 0;
            text-transform: uppercase;
        }

        .achievement-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        footer {
            padding: 60px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            border-top: 1px solid var(--gray);
            font-size: 12px;
            color: #666;
        }

        @media (max-width: 768px) {
            .hero-title { font-size: 80px; }
            .header-logo { width: 100%; height: 40vh; position: relative; }
            .roster { grid-template-columns: 1fr 1fr; }
            .achievements-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <img src="babyjonphotkachotka.jpg" class="header-logo" alt="Main Logo">
        <h1 class="hero-title">BABY<br>JONS</h1>
        <div class="subtitle">Перспективна команда молодих талантів</div>
    </header>

    <section>
        <h2>The Roster</h2>
        <div class="roster">
            <div class="player">
                <span class="pos-tag">Pos 1</span>
                <img src="роза.png" class="photo" alt="rosa">
                <div class="name">rosa nekeʼelk chaq saʼ jun li bʼ</div>
            </div>
            <div class="player">
                <span class="pos-tag">Pos 2</span>
                <img src="вайро.png" class="photo" alt="wairo">
                <div class="name">wairo</div>
            </div>
            <div class="player">
                <span class="pos-tag">Pos 3</span>
                <img src="зенг.png" class="photo" alt="zeng">
                <div class="name">Zeng</div>
            </div>
            <div class="player">
                <span class="pos-tag">Pos 4</span>
                <img src="редагон.png" class="photo" alt="redagon">
                <div class="name">Redagon</div>
            </div>
            <div class="player">
                <span class="pos-tag">Pos 5</span>
                <img src="мавін.png" class="photo" alt="mavin">
                <div class="name">MavinML</div>
            </div>
        </div>
    </section>

    <section style="padding: 0;">
        <div class="achievements-grid">
            <div class="text-side">
                <h2 style="color: white; border: none;">Awards</h2>
                <ul class="achievements-list">
                    <li>1 місце - The техніКАЛ турнамент</li>
                    <li>Колбаса з сиром</li>
                    <li>Мікроволновка</li>
                </ul>
            </div>
            <img src="konskazalypa.png" class="achievement-image" alt="Award Image">
        </div>
    </section>

    <footer>
        <div>BABYJONS © 2026</div>
    </footer>
</div>

</body>
</html>
