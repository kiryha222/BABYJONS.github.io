<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BABYJONS | Official Website</title>
    <style>
        body {
            margin: 0;
            background-color: #0a0a0a;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 700px;
            padding: 60px 20px;
        }

        header { 
            margin-bottom: 60px; 
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .header-logo {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #a855f7;
            background-color: #1a1a1a;
        }

        .header-text h1 { 
            font-size: 24px; 
            letter-spacing: 6px; 
            text-transform: uppercase; 
            color: #a855f7;
            margin: 0;
        }

        .subtitle { 
            font-size: 12px; 
            color: #444; 
            margin-top: 5px; 
            letter-spacing: 1px;
        }

        section { margin-bottom: 50px; }

        h2 {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #666;
            border-bottom: 1px solid #1a1a1a;
            padding-bottom: 8px;
            margin-bottom: 25px;
        }

        .roster {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 25px;
        }

        .player { text-align: left; }

        .photo {
            width: 100%;
            aspect-ratio: 1/1;
            background-color: #1a1a1a;
            object-fit: cover;
            margin-bottom: 12px;
            display: block;
            border-radius: 2px;
        }

        .name { font-size: 16px; font-weight: 500; color: #eee; }
        .pos { 
            font-size: 10px; 
            color: #a855f7; 
            text-transform: uppercase; 
            margin-bottom: 4px; 
            display: block;
            font-weight: bold;
        }

        .achievements-list {
            list-style: none;
            padding: 0;
            font-size: 14px;
            color: #ccc;
        }

        .achievements-list li {
            margin-bottom: 12px;
            padding-left: 15px;
            border-left: 2px solid #a855f7;
            line-height: 1.4;
        }

        footer { 
            margin-top: 80px; 
            border-top: 1px solid #1a1a1a; 
            padding-top: 20px; 
            color: #333; 
            font-size: 10px;
            text-align: center;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <img src="babyjonphotkachotka.jpg" alt="BABYJONS Logo" class="header-logo">
        <div class="header-text">
            <h1>BABYJONS</h1>
            <div class="subtitle">Перспективна команда молодих талантів шукає спонсорів</div>
        </div>
    </header>

    <section>
        <h2>Active Roster</h2>
        <div class="roster">
            <div class="player">
                <img src="babyjonphotkachotka.jpg" alt="Andrey" class="photo">
                <span class="pos">Pos 1</span>
                <div class="name">Андрюха</div>
            </div>
            <div class="player">
                <img src="babyjonphotkachotka.jpg" alt="wairo" class="photo">
                <span class="pos">Pos 2</span>
                <div class="name">wairo</div>
            </div>
            <div class="player">
                <img src="babyjonphotkachotka.jpg" alt="Zeng" class="photo">
                <span class="pos">Pos 3</span>
                <div class="name">Zeng</div>
            </div>
            <div class="player">
                <img src="babyjonphotkachotka.jpg" alt="Redagon" class="photo">
                <span class="pos">Pos 4</span>
                <div class="name">Redagon</div>
            </div>
            <div class="player">
                <img src="babyjonphotkachotka.jpg" alt="MavinML" class="photo">
                <span class="pos">Pos 5</span>
                <div class="name">MavinML</div>
            </div>
        </div>
    </section>

    <section>
        <h2>Achievements</h2>
        <ul class="achievements-list">
            <li>1 місце - The техніКАЛ турнамент</li>
            <li>Колбаса з сиром</li>
            <li>Мікроволновка</li>
        </ul>
    </section>

    <footer>
        &copy; 2026 BABYJONS
    </footer>
</div>

</body>
</html>
